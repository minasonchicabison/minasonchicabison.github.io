<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5/index.css">
<style>
:root{--mw-accent:#8f7cff;--mw-g1:#8f7cff;--mw-g2:#4f46e5;--mw-bg:#0a0a12;--mw-fg:#ececf6;--mw-mut:#9a9ab4;--mw-line:rgba(255,255,255,.1);--mw-glass:rgba(255,255,255,.055);--spring:cubic-bezier(.34,1.5,.5,1)}
/*VARS*/
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
html{background:var(--mw-bg);background-image:radial-gradient(55vmax 40vmax at 50% 52%,color-mix(in srgb,var(--mw-g1) 20%,transparent),transparent),radial-gradient(55vmax 42vmax at 106% 112%,color-mix(in srgb,var(--mw-g2) 28%,transparent),transparent);color:var(--mw-fg);font-family:"Manrope Variable",Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
#grid{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 40px}
.brand{position:relative;margin:0;font-weight:200;font-size:clamp(52px,8.5vw,100px);letter-spacing:-.055em;line-height:1}
.brand span{color:color-mix(in srgb,var(--mw-accent) 75%,#fff)}
.ver{position:absolute;top:-6px;right:-62px;padding:7px 13px;border-radius:999px;font-size:19px;font-weight:700;letter-spacing:0;color:var(--mw-accent);background:var(--mw-glass);border:1px solid var(--mw-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.tag{margin:14px 0 26px;font-size:16px;font-weight:400;color:var(--mw-mut)}
form{width:min(580px,92vw)}
.search{display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;border-radius:999px;border:1px solid var(--mw-line);background:var(--mw-glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 14px 40px rgba(0,0,0,.3);transition:box-shadow .35s,border-color .35s,transform .5s var(--spring)}
.search:focus-within{border-color:var(--mw-accent);transform:scale(1.015);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 4px color-mix(in srgb,var(--mw-accent) 28%,transparent),0 0 40px -6px var(--mw-accent)}
.search svg{flex:none;color:var(--mw-mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--mw-fg);font:500 16px inherit;font-family:inherit}
.search input::placeholder{color:var(--mw-mut)}
.bm{margin-top:34px;text-align:center}
.bm h2{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mw-mut)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.chip{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:14px;border:1px solid var(--mw-line);background:var(--mw-glass);color:var(--mw-fg);font:600 13.5px inherit;font-family:inherit;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:transform .45s var(--spring),background .25s}
.chip:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.chip:active{transform:scale(.95)}
.chip img{width:16px;height:16px;border-radius:4px}
.chip.add{border-style:dashed;background:transparent;color:var(--mw-mut)}
.chip .x{display:none;margin-left:2px;width:18px;height:18px;border-radius:50%;place-items:center;font-size:13px;line-height:1;color:var(--mw-mut)}
.chip:hover .x{display:grid}
.chip .x:hover{background:var(--mw-line);color:var(--mw-fg)}
/* dynamic island */
#mwi{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;width:150px;height:42px;min-width:150px;max-width:calc(100vw - 24px);overflow:hidden;cursor:pointer;background:linear-gradient(145deg,rgba(27,27,37,.98),rgba(0,0,0,.98));color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:22px;font:600 13px/1 "Manrope Variable",Manrope,system-ui,sans-serif;box-shadow:0 0 0 1px rgba(255,255,255,.035),0 12px 38px rgba(0,0,0,.48),0 0 34px -9px var(--mw-accent);transition:width .56s cubic-bezier(.2,1.35,.35,1),height .56s cubic-bezier(.2,1.35,.35,1),border-radius .48s cubic-bezier(.2,1.2,.35,1),box-shadow .3s;user-select:none;outline:none;will-change:width,height}#mwi:hover{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 14px 42px rgba(0,0,0,.55),0 0 42px -8px var(--mw-accent)}#mwi:focus-visible{box-shadow:0 0 0 2px var(--mw-accent),0 14px 42px rgba(0,0,0,.55)}
.ly{position:absolute;left:50%;top:50%;display:flex;align-items:center;white-space:nowrap;opacity:0;filter:blur(9px);transform:translate(-50%,-50%) scale(.82);transition:opacity .3s,filter .4s,transform .55s cubic-bezier(.34,1.4,.5,1);pointer-events:none}
.ly.on{opacity:1;filter:none;transform:translate(-50%,-50%)}
#mwc{gap:13px;padding:10px 16px}
#mwe{gap:26px;padding:18px 28px}
.mwr{display:flex;align-items:center;gap:6px}
.mwc{display:flex;flex-direction:column;gap:5px}
.mwc small{font-size:11.5px;font-weight:500;color:#a1a1b5}
.mwc b.big{font-size:26px;font-weight:700;letter-spacing:-.03em}
.mwc b.mid{font-size:22px;font-weight:700;letter-spacing:-.02em}
@media (max-width:700px){.ver{right:-8px;top:-34px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="grid"></canvas>
<div id="mwi" role="button" tabindex="0" aria-label="Expand date, weather and battery status" aria-controls="mwe" aria-expanded="false">
  <div id="mwc" class="ly on"><b id="ct"></b><span id="cw" class="mwr"></span><span id="cb" class="mwr"></span></div>
  <div id="mwe" class="ly"><div class="mwc"><b class="big" id="et"></b><small id="ed"></small></div><div class="mwc" id="ew"></div><div class="mwc" id="eb"></div></div>
</div>
<main>
  <h1 class="brand">minason <span>web</span><i class="ver">v2</i></h1>
  <p class="tag">/*WELCOME_MESSAGE*/</p>
  <form id="f" autocomplete="off">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" spellcheck="false" placeholder="Search or enter address" aria-label="Search or enter address">
    </label>
  </form>
  <section class="bm"><h2>Bookmarks</h2><div class="chips" id="chips"></div></section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function hex(h){h=(h||"").trim().replace("#","");if(h.length!==6)return[143,124,255];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
var S={bat:null,wx:null},rgb=hex(getComputedStyle(document.documentElement).getPropertyValue("--mw-accent")),prevCh=null;
function send(m){parent.postMessage(m,"*")}

/* search + bookmarks */
$("f").addEventListener("submit",function(e){e.preventDefault();var v=$("q").value.trim();if(v)send({type:"mw-go",q:v})});
function chips(list){var box=$("chips");box.innerHTML="";
(list||[]).forEach(function(b,i){var c=document.createElement("button");c.className="chip";c.type="button";
var im=document.createElement("img");try{im.src="https://icons.duckduckgo.com/ip3/"+new URL(b.u).hostname+".ico"}catch(e){}im.alt="";im.onerror=function(){im.remove()};c.appendChild(im);
c.appendChild(document.createTextNode(b.t));
var x=document.createElement("span");x.className="x";x.textContent="\u00d7";x.title="Remove";x.onclick=function(ev){ev.stopPropagation();send({type:"mw-rm-bm",i:i})};c.appendChild(x);
c.onclick=function(){send({type:"mw-go",q:b.u})};box.appendChild(c)});
var a=document.createElement("button");a.className="chip add";a.type="button";a.textContent="+  Add";a.onclick=function(){send({type:"mw-add-bm"})};box.appendChild(a)}
chips([]);

/* springy reactive grid with a bright cursor field and trailing ripples */
var canvas=$("grid"),ctx=canvas&&canvas.getContext("2d"),W=0,H=0,D=[],ripples=[];
var spacing=28,dpr=1,pointer={x:-1000,y:-1000},lastPointer=null,lastRippleAt=0,lastFrame=0;
var reduceMotion=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function resizeGrid(){
  dpr=Math.min(window.devicePixelRatio||1,1.6);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  D=[];
  for(var y=spacing/2;y<H+spacing;y+=spacing){
    for(var x0=spacing/2;x0<W+spacing;x0+=spacing){
      D.push({hx:x0,hy:y,x:x0,y:y,vx:0,vy:0});
    }
  }
  renderGrid(0);
}
function addRipple(x,y,power){
  ripples.push({x:x,y:y,time:performance.now(),power:power||1});
  if(ripples.length>14)ripples.shift();
}
function renderGrid(now){
  if(!ctx)return;
  ctx.clearRect(0,0,W,H);
  var color="rgb("+rgb[0]+","+rgb[1]+","+rgb[2]+")";
  ripples=ripples.filter(function(r){return now-r.time<1650});
  for(var i=0;i<D.length;i++){
    var p=D[i],dx=p.x-pointer.x,dy=p.y-pointer.y;
    var dist=Math.sqrt(dx*dx+dy*dy)||1;
    var cursorGlow=dist<250?Math.pow(1-dist/250,2.15):0;
    var rippleGlow=0;
    for(var k=0;k<ripples.length;k++){
      var r=ripples[k],age=now-r.time,rx=p.hx-r.x,ry=p.hy-r.y;
      var rd=Math.sqrt(rx*rx+ry*ry)||1;
      var ring=age*.68;
      var wave=Math.exp(-Math.pow((rd-ring)/21,2))*(1-age/1650)*r.power;
      if(wave>rippleGlow)rippleGlow=wave;
    }
    var motion=Math.min(1,Math.hypot(p.x-p.hx,p.y-p.hy)/25);
    var glow=Math.min(1,Math.max(cursorGlow*1.35,rippleGlow*1.3,motion*.8));
    ctx.globalAlpha=.16+glow*.82;
    ctx.fillStyle=glow>.025?color:"#c5c5e4";
    ctx.shadowColor=color;
    ctx.shadowBlur=glow>.06?Math.min(25,glow*27):0;
    var radius=.8+glow*1.65;
    ctx.beginPath();
    ctx.arc(p.x,p.y,radius,0,Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
}
function animateGrid(now){
  if(document.hidden)return;
  var dt=lastFrame?Math.min((now-lastFrame)/16.667,2):1;
  lastFrame=now;
  if(!reduceMotion){
    for(var i=0;i<D.length;i++){
      var p=D[i];
      var targetY=p.hy+Math.sin(now*.00052+p.hx*.008+p.hy*.006)*1.05;
      var ax=(p.hx-p.x)*.038,ay=(targetY-p.y)*.038;
      var dx=p.x-pointer.x,dy=p.y-pointer.y;
      var dist=Math.sqrt(dx*dx+dy*dy)||1;
      if(dist<250){
        var f=1-dist/250;
        var force=f*f*.95;
        ax+=(dx/dist)*force-(dy/dist)*force*.18;
        ay+=(dy/dist)*force+(dx/dist)*force*.18;
      }
      for(var k=0;k<ripples.length;k++){
        var r=ripples[k],age=now-r.time,rx=p.hx-r.x,ry=p.hy-r.y;
        var rd=Math.sqrt(rx*rx+ry*ry)||1;
        var wave=Math.exp(-Math.pow((rd-age*.68)/21,2))*(1-age/1650)*r.power;
        if(wave>.003){
          ax+=(rx/rd)*wave*.84;
          ay+=(ry/rd)*wave*.84;
        }
      }
      p.vx=(p.vx+ax*dt)*Math.pow(.855,dt);
      p.vy=(p.vy+ay*dt)*Math.pow(.855,dt);
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
    }
  }
  renderGrid(now);
  requestAnimationFrame(animateGrid);
}
if(ctx){
  resizeGrid();
  window.addEventListener("resize",resizeGrid,{passive:true});
  window.addEventListener("pointermove",function(e){
    pointer.x=e.clientX;pointer.y=e.clientY;
    if(lastPointer){
      var distance=Math.hypot(e.clientX-lastPointer.x,e.clientY-lastPointer.y);
      if(distance>18&&performance.now()-lastRippleAt>28){
        addRipple(lastPointer.x,lastPointer.y,Math.min(1.25,.55+distance/130));
        lastRippleAt=performance.now();
      }
    }
    lastPointer={x:e.clientX,y:e.clientY};
  },{passive:true});
  window.addEventListener("pointerout",function(e){
    if(!e.relatedTarget){pointer.x=-1000;pointer.y=-1000;lastPointer=null;}
  },{passive:true});
  window.addEventListener("pointerdown",function(e){addRipple(e.clientX,e.clientY,1.55);},{passive:true});
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden){lastFrame=0;requestAnimationFrame(animateGrid);}
  });
  if(reduceMotion)renderGrid(0);
  else requestAnimationFrame(animateGrid);
}

/* dynamic island */
var I=$("mwi"),C=$("mwc"),E=$("mwe"),open=false,pinned=false,hover=false,flash=0;
function kind(c){if(c===0)return"clear";if(c<4)return"cloud";if(c<50)return"fog";if(c<70||(c>=80&&c<83))return"rain";if(c<80||c===85||c===86)return"snow";return"storm"}
var NAMES={clear:"Clear",cloud:"Cloudy",fog:"Fog",rain:"Rain",snow:"Snow",storm:"Storm"};
function ic(w,s){var k=kind(w.code),cl='<path d="M7 18a4 4 0 0 1-.6-8A5.5 5.5 0 0 1 17 11.3 3.4 3.4 0 0 1 17 18z" fill="#cbd5e1"/>',b;
if(k==="clear")b=w.day?'<circle cx="12" cy="12" r="4.5" fill="#fbbf24"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round"/>':'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="#c7d2fe"/>';
else if(k==="cloud")b=cl;
else if(k==="fog")b=cl+'<path d="M6 20.5h12" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round"/>';
else if(k==="rain")b=cl+'<path d="M8 19.5l-1 2.5M12 19.5l-1 2.5M16 19.5l-1 2.5" stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round"/>';
else if(k==="snow")b=cl+'<circle cx="8" cy="21" r="1.1" fill="#e0f2fe"/><circle cx="12" cy="21" r="1.1" fill="#e0f2fe"/><circle cx="16" cy="21" r="1.1" fill="#e0f2fe"/>';
else b=cl+'<path d="M12.5 17.5 10 21h2.6l-.8 2.5" stroke="#facc15" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24">'+b+'</svg>'}
function bt(b,s){var col=b.charging?"#30d158":b.level<=20?"#ff453a":"#fff",fw=18*b.level/100;
return'<svg width="'+25*s+'" height="'+12*s+'" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="'+fw+'" height="8" rx="2" fill="'+col+'"/><rect x="23" y="4" width="1.8" height="4" rx=".9" fill="#fff" opacity=".4"/>'+(b.charging?'<path d="M12.6 1.8 8.4 6.5h2.7l-.7 3.7 4.2-4.8h-2.7z" fill="#fff" stroke="#000" stroke-width=".5" stroke-linejoin="round"/>':'')+'</svg>'}
function fit(){requestAnimationFrame(function(){var l=open?E:C;var w=Math.max(open?0:150,l.scrollWidth+(open?44:0));var h=Math.max(open?0:42,l.scrollHeight+(open?26:0));w=Math.min(w,innerWidth-24);I.style.width=w+"px";I.style.height=h+"px";I.style.borderRadius=open?"30px":"22px"})}
function setOpen(o){open=!!o;I.setAttribute("aria-expanded",open?"true":"false");C.classList.toggle("on",!open);E.classList.toggle("on",open);fit()}
function tick(){var n=new Date();$("ct").textContent=n.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});$("et").textContent=$("ct").textContent;$("ed").textContent=n.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}
function render(){var w=S.wx,b=S.bat;
$("cw").innerHTML=w?ic(w,17)+"<b>"+w.temp+"\u00b0</b>":"";
$("cb").innerHTML=b?"<b>"+b.level+"%</b>"+bt(b,1):"";
$("ew").innerHTML=w?'<div class="mwr">'+ic(w,34)+'<div class="mwc"><b class="mid">'+w.temp+"\u00b0</b><small>"+NAMES[kind(w.code)]+(w.city?" - "+w.city:"")+"</small></div></div>":"";
$("eb").innerHTML=b?'<div class="mwr">'+bt(b,1.5)+'<div class="mwc"><b class="mid">'+b.level+"%</b><small>"+(b.charging?"Charging":"On battery")+"</small></div></div>":"";
tick();fit();
if(b&&prevCh!==null&&prevCh!==b.charging){clearTimeout(flash);setOpen(true);flash=setTimeout(function(){flash=0;if(!pinned&&!hover)setOpen(false)},3200)}
if(b)prevCh=b.charging}
setInterval(tick,1000);tick();
I.addEventListener("mouseenter",function(){hover=true;if(!pinned)setOpen(true)});
I.addEventListener("mouseleave",function(){hover=false;if(!pinned&&!flash)setOpen(false)});
I.addEventListener("click",function(){pinned=!pinned;setOpen(pinned)});
I.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pinned=!pinned;setOpen(pinned)}else if(e.key==="Escape"){pinned=false;setOpen(false)}});
window.addEventListener("resize",fit,{passive:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
fit();

/* state from the shell: theme, battery, weather, bookmarks */
addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="mw-state")return;
if(d.vars){for(var k in d.vars)document.documentElement.style.setProperty(k,d.vars[k]);rgb=hex(d.vars["--mw-accent"])}
S.bat=d.bat;S.wx=d.wx;chips(d.bm);render()});
send({type:"mw-ready"});
})();
</script>
</body>
</html>
