<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5/index.css">
<style>
:root{--mw-accent:#8f7cff;--mw-g1:#8f7cff;--mw-g2:#4f46e5;--mw-bg:#0a0a12;--mw-fg:#ececf6;--mw-mut:#9a9ab4;--mw-line:rgba(255,255,255,.1);--mw-glass:rgba(255,255,255,.055);--spring:cubic-bezier(.34,1.5,.5,1)}
/*VARS*/
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
html{background:var(--mw-bg);background-image:radial-gradient(55vmax 40vmax at 50% 52%,color-mix(in srgb,var(--mw-g1) 20%,transparent),transparent),radial-gradient(55vmax 42vmax at 106% 112%,color-mix(in srgb,var(--mw-g2) 28%,transparent),transparent);color:var(--mw-fg);font-family:"Manrope Variable",Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
#grid{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 40px}
.brand{position:relative;margin:0;font-weight:200;font-size:clamp(52px,8.5vw,100px);letter-spacing:-.055em;line-height:1}
.brand span{color:color-mix(in srgb,var(--mw-accent) 75%,#fff)}
.ver{position:absolute;top:-6px;right:-62px;padding:7px 13px;border-radius:999px;font-size:19px;font-weight:700;letter-spacing:0;color:var(--mw-accent);background:var(--mw-glass);border:1px solid var(--mw-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.tag{margin:14px 0 26px;font-size:16px;font-weight:400;color:var(--mw-mut)}
form{width:min(580px,92vw)}
.search{display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;border-radius:999px;border:1px solid var(--mw-line);background:var(--mw-glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 14px 40px rgba(0,0,0,.3);transition:box-shadow .35s,border-color .35s,transform .5s var(--spring)}
.search:focus-within{border-color:var(--mw-accent);transform:scale(1.015);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 4px color-mix(in srgb,var(--mw-accent) 28%,transparent),0 0 40px -6px var(--mw-accent)}
.search svg{flex:none;color:var(--mw-mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--mw-fg);font:500 16px inherit;font-family:inherit}
.search input::placeholder{color:var(--mw-mut)}
.bm{margin-top:34px;text-align:center}
.bm h2{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mw-mut)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.chip{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:14px;border:1px solid var(--mw-line);background:var(--mw-glass);color:var(--mw-fg);font:600 13.5px inherit;font-family:inherit;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:transform .45s var(--spring),background .25s}
.chip:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.chip:active{transform:scale(.95)}
.chip img{width:16px;height:16px;border-radius:4px}
.chip.add{border-style:dashed;background:transparent;color:var(--mw-mut)}
.chip .x{display:none;margin-left:2px;width:18px;height:18px;border-radius:50%;place-items:center;font-size:13px;line-height:1;color:var(--mw-mut)}
.chip:hover .x{display:grid}
.chip .x:hover{background:var(--mw-line);color:var(--mw-fg)}
/* compact live indicators + correctly measured expanded Dynamic Island */
#mwi{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2147483001;width:210px;height:48px;max-width:calc(100vw - 24px);overflow:hidden;cursor:pointer;background:linear-gradient(145deg,rgba(25,26,43,.985),rgba(4,5,13,.99));color:#fff;border:1px solid rgba(206,203,255,.2);border-radius:26px;font:600 12px/1 "Manrope Variable",Manrope,system-ui,sans-serif;box-shadow:0 0 0 1px rgba(255,255,255,.035),0 12px 38px rgba(0,0,0,.48),0 0 28px -8px var(--mw-accent);transition:width .56s cubic-bezier(.16,1,.3,1),height .56s cubic-bezier(.16,1,.3,1),border-radius .52s cubic-bezier(.16,1,.3,1),box-shadow .4s ease;user-select:none;outline:none;will-change:width,height}
#mwi.is-open{border-radius:27px;border-color:color-mix(in srgb,var(--mw-accent) 48%,rgba(255,255,255,.2));box-shadow:0 0 0 1px rgba(255,255,255,.07),0 24px 72px rgba(0,0,0,.62),0 0 48px -10px var(--mw-accent),inset 0 1px 0 rgba(255,255,255,.14)}

.ly{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;filter:blur(7px);transform:translate3d(0,5px,0) scale(.97);transition:opacity .25s ease,filter .32s ease,transform .48s cubic-bezier(.16,1,.3,1);pointer-events:none}
.ly.on{opacity:1;filter:none;transform:translate3d(0,0,0) scale(1)}
#mwc{gap:10px;padding:0 16px;white-space:nowrap}
.mini-time{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.mini-sep{width:1px;height:16px;flex:none;background:rgba(255,255,255,.18)}
.mini-meta{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:0;color:#f1f0ff;font-size:10px;font-weight:850;font-variant-numeric:tabular-nums}
.mini-meta svg{display:block;flex:none}
.mini-weather svg{width:16px;height:16px}
.mini-battery svg{width:24px;height:12px}
#mwe{position:absolute;top:0;left:0;right:auto;bottom:auto;width:min(390px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;display:block;white-space:normal;overflow:visible}
.di-content{position:relative;display:flex;flex-direction:column;gap:11px;padding:17px 18px 16px;min-width:0;transition:opacity .2s ease,filter .2s ease,transform .25s ease}
.di-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.di-kicker{display:flex;align-items:center;gap:7px;color:#b9b5d9;font-size:9px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}
.di-live{width:6px;height:6px;border-radius:50%;background:#39e8c1;box-shadow:0 0 11px rgba(57,232,193,.88);animation:di-live-pulse 1.8s ease-in-out infinite}

.di-time{color:#a8aac4;font-size:10px;font-weight:750;font-variant-numeric:tabular-nums}
.di-metrics{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
.di-metric{display:flex;align-items:center;gap:9px;min-width:0;min-height:51px;padding:8px 10px;border:1px solid rgba(255,255,255,.085);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.055)}

.di-metric-icon svg{display:block}
.di-metric-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.di-metric-value{color:#f7f5ff;font-size:17px;font-weight:900;letter-spacing:-.04em;line-height:1}
.di-metric-label{overflow:hidden;color:#a3a6c0;font-size:8px;font-weight:750;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}
.di-current{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.di-current-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.di-label{color:#8f93b1;font-size:8px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.di-period{color:#f4f2ff;font-size:20px;font-weight:950;letter-spacing:-.045em;line-height:1.08;overflow-wrap:anywhere}
.di-left{flex:none;color:var(--mw-accent);font-size:11px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.di-progress-wrap{position:relative;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.105);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.di-progress{width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mw-g1),var(--mw-accent),#65e7d3);box-shadow:0 0 16px color-mix(in srgb,var(--mw-accent) 65%,transparent);transition:width .85s cubic-bezier(.16,1,.3,1)}
.di-shine{position:absolute;top:0;bottom:0;left:-35%;width:26%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);filter:blur(1px);animation:di-shine 2.15s ease-in-out infinite}
@keyframes di-shine{0%{transform:translateX(0);opacity:0}18%{opacity:.8}100%{transform:translateX(520%);opacity:0}}
.di-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#9da2c0;font-size:9px;font-weight:750;line-height:1.45}
.di-next{color:#c9c5e8}
.di-note{min-height:12px;color:#8189a8;font-size:9px;line-height:1.45}
#mwi.out .di-live{background:#a2a8c4;box-shadow:0 0 8px rgba(162,168,196,.5);animation:none}
#mwi.out .di-progress{opacity:.28}
.di-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:190px;border-radius:27px;background:linear-gradient(145deg,rgba(24,25,43,.985),rgba(5,6,16,.99));opacity:0;filter:blur(7px);transform:scale(.97);pointer-events:none;transition:opacity .24s ease,filter .32s ease,transform .42s cubic-bezier(.16,1,.3,1)}

#mwi.is-loading .di-loader{opacity:1;filter:none;transform:scale(1)}
.di-loader-orbit{position:relative;width:42px;height:42px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 26px color-mix(in srgb,var(--mw-accent) 30%,transparent),inset 0 0 14px rgba(255,255,255,.045);animation:di-orbit 2.6s linear infinite}
.di-loader-orbit:before{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--mw-accent) 60%,transparent);border-left-color:transparent;border-radius:50%;animation:di-orbit 1.25s linear infinite reverse}
.di-loader-orbit:after{content:"";position:absolute;left:17px;top:-3px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 13px var(--mw-accent),0 0 24px var(--mw-accent)}
.di-loader-copy{display:flex;flex-direction:column;align-items:center;gap:4px}
.di-loader-copy strong{color:#f4f2ff;font-size:11px;font-weight:900;letter-spacing:.02em}
.di-loader-copy span{color:#8e93b4;font-size:8px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
.di-loader-bar{position:relative;width:118px;height:3px;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.1)}
.di-loader-bar span{position:absolute;inset:0 auto 0 -45%;width:42%;border-radius:10px;background:linear-gradient(90deg,transparent,var(--mw-accent),#8ce9dc,transparent);animation:di-loader-sweep 1.05s cubic-bezier(.45,0,.55,1) infinite}
@keyframes di-orbit{to{transform:rotate(360deg)}}
@keyframes di-loader-sweep{to{transform:translateX(350%)}}
@media(prefers-reduced-motion:reduce){#mwi,.ly,.di-content,.di-loader,.di-progress,.di-live,.di-shine,.di-loader-orbit,.di-loader-bar span{transition:none!important;animation:none!important}}
@media (max-width:700px){.ver{right:-8px;top:-34px}}
@media (max-width:560px){
  main{padding:0 14px 26px}
  .brand{font-size:clamp(43px,11.5vw,68px)}
  .ver{right:-4px;top:-29px;padding:5px 9px;font-size:14px}
  .tag{margin:10px 0 20px;font-size:13px;text-align:center}
  form{width:min(580px,94vw)}
  .search{height:50px;padding:0 15px;gap:9px}
  .search input{font-size:14px}
  .bm{margin-top:22px}
  .chips{gap:7px}
  .chip{height:36px;padding:0 12px;font-size:12px}
  #mwi{top:8px}
}
@media (max-width:380px){
  main{padding-left:10px;padding-right:10px}
  .brand{font-size:clamp(40px,10.8vw,48px)}
  .ver{right:-8px;top:-26px;font-size:12px;padding:4px 8px}
  .tag{font-size:12px}
  .chip{height:34px;padding:0 10px;font-size:11px}
}
@media (max-height:650px){
  main{padding-bottom:14px}
  .tag{margin-top:8px;margin-bottom:16px}
  .bm{margin-top:16px}
  .bm h2{margin-bottom:8px}
  .chip{height:35px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

function minuteOf(parts){return parts[0]*60+parts[1]}
function fmtScheduleTime(parts){
  var h=parts[0],m=String(parts[1]).padStart(2,"0"),suffix=h>=12?"PM":"AM";
  return ((h+11)%12+1)+":"+m+" "+suffix;
}
function remainingString(minutes){
  var value=Math.max(0,Math.ceil(minutes));
  if(value<1)return "less than 1 min";
  return value+(value===1?" min":" mins");
}
function startIslandLoading(){
  I.classList.add("is-loading");
  window.clearTimeout(loadingTimer);
  loadingTimer=window.setTimeout(function(){
    I.classList.remove("is-loading");
    fitIsland();
  },1050);
  send({type:"mw-refresh-live"});
}
function setOpen(value){
  var next=!!value,changed=next!==open;
  open=next;
  I.classList.toggle("is-open",open);
  I.setAttribute("aria-expanded",open?"true":"false");
  C.classList.toggle("on",!open);
  E.classList.toggle("on",open);
  if(open&&changed)startIslandLoading();
  if(!open){
    window.clearTimeout(loadingTimer);
    I.classList.remove("is-loading");
  }
  fitIsland();
}
function fitIsland(){
  requestAnimationFrame(function(){
    if(open){
      var width=Math.min(390,Math.max(220,innerWidth-24));
      E.style.width=width+"px";
      var height=Math.ceil(E.getBoundingClientRect().height);
      height=Math.min(Math.max(190,height),innerHeight-24);
      I.style.width=width+"px";
      I.style.height=height+"px";
      I.style.borderRadius="27px";
    }else{
      I.style.width="210px";
      I.style.height="48px";
      I.style.borderRadius="26px";
    }
  });
}
function updateSchoolStatus(){
  var now=new Date(),weekday=now.getDay();
  var minutes=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  var timeText=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  var dateText=now.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});
  timeEl.textContent=timeText;
  expandedTimeEl.textContent=dateText+" · "+timeText;

  var first=minuteOf(schedule[0].start),last=minuteOf(schedule[schedule.length-1].end);
  var title="No school today",left="Enjoy your day",detail=dateText,next="School resumes Monday";
  var badge="WEEKEND",percent=0,off=true,note="The school clock is taking the day off.";

  if(weekday!==0&&weekday!==6){
    off=false;
    if(minutes<first){
      var untilFirst=first-minutes;
      title="Before school";
      left=remainingString(untilFirst)+" to Period 1";
      detail="First bell · "+fmtScheduleTime(schedule[0].start);
      next="Up next · Period 1";
      badge="BEFORE SCHOOL";
      note="Getting ready for the first period.";
    }else if(minutes>=last){
      title="School day complete";
      left="All periods finished";
      detail="Last bell · "+fmtScheduleTime(schedule[schedule.length-1].end);
      next="See you next school day";
      badge="SCHOOL DAY COMPLETE";
      percent=100;
      note="You're free. The school clock is off duty.";
    }else{
      for(var i=0;i<schedule.length;i++){
        var current=schedule[i],start=minuteOf(current.start),end=minuteOf(current.end);
        if(minutes>=start&&minutes<end){
          var elapsed=minutes-start,duration=end-start;
          title=current.id;
          left=remainingString(end-minutes)+" left";
          detail=fmtScheduleTime(current.start)+" – "+fmtScheduleTime(current.end);
          percent=Math.max(0,Math.min(100,elapsed/duration*100));
          badge="NOW IN SESSION";
          next=i<schedule.length-1
            ?"Up next · "+schedule[i+1].id+" at "+fmtScheduleTime(schedule[i+1].start)
            :"Final period";
          note="Period progress · "+Math.round(percent)+"% complete.";
          break;
        }
        if(i<schedule.length-1){
          var following=schedule[i+1],nextStart=minuteOf(following.start);
          if(minutes>=end&&minutes<nextStart){
            var gapDuration=nextStart-end,gapElapsed=minutes-end;
            title="Passing period";
            left=remainingString(nextStart-minutes)+" left";
            detail="Between "+current.id+" & "+following.id;
            percent=Math.max(0,Math.min(100,gapElapsed/gapDuration*100));
            badge="BETWEEN PERIODS";
            next="Up next · "+following.id+" at "+fmtScheduleTime(following.start);
            note="Take a breath. The next period is coming up.";
            break;
          }
        }
      }
    }
  }
  periodEl.textContent=title;
  leftEl.textContent=left;
  badgeEl.textContent=badge;
  detailEl.textContent=detail;
  nextEl.textContent=next;
  noteEl.textContent=note;
  progressEl.style.width=percent.toFixed(2)+"%";
  I.classList.toggle("out",off);
  fitIsland();
}

function weatherKind(code){
  if(code===0)return"clear";
  if(code<=3)return"cloud";
  if(code<=48)return"fog";
  if(code<70||(code>=80&&code<=82))return"rain";
  if(code<80||code===85||code===86)return"snow";
  return"storm";
}
var WEATHER_NAMES={clear:"Clear",cloud:"Cloudy",fog:"Fog",rain:"Rain",snow:"Snow",storm:"Thunderstorms"};
function weatherSvg(w,size){
  var k=weatherKind(Number(w.code)),cloud='<path d="M7 18a4 4 0 0 1-.6-8A5.5 5.5 0 0 1 17 11.3 3.4 3.4 0 0 1 17 18z" fill="#cbd5e1"/>',shape;
  if(k==="clear")shape=w.day?'<circle cx="12" cy="12" r="4.5" fill="#fbbf24"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round"/>':'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="#c7d2fe"/>';
  else if(k==="cloud")shape=cloud;
  else if(k==="fog")shape=cloud+'<path d="M6 20.5h12" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round"/>';
  else if(k==="rain")shape=cloud+'<path d="M8 19.5l-1 2.5M12 19.5l-1 2.5M16 19.5l-1 2.5" stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round"/>';
  else if(k==="snow")shape=cloud+'<circle cx="8" cy="21" r="1.1" fill="#e0f2fe"/><circle cx="12" cy="21" r="1.1" fill="#e0f2fe"/><circle cx="16" cy="21" r="1.1" fill="#e0f2fe"/>';
  else shape=cloud+'<path d="M12.5 17.5 10 21h2.6l-.8 2.5" stroke="#facc15" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" aria-hidden="true">'+shape+'</svg>';
}
function batterySvg(b,scale){
  var level=Math.max(0,Math.min(100,Number(b.level)||0));
  var color=b.charging?"#30d158":level<=20?"#ff453a":"#fff";
  var fill=18*level/100;
  return '<svg width="'+(25*scale)+'" height="'+(12*scale)+'" viewBox="0 0 25 12" aria-hidden="true"><rect x=".5" y=".5" width="21" height="11" rx="3.5" fill="none" stroke="#fff" opacity=".48"/><rect x="2" y="2" width="'+fill+'" height="8" rx="2" fill="'+color+'"/><rect x="23" y="4" width="1.8" height="4" rx=".9" fill="#fff" opacity=".45"/>'+(b.charging?'<path d="M12.6 1.8 8.4 6.5h2.7l-.7 3.7 4.2-4.8h-2.7z" fill="#fff" stroke="#000" stroke-width=".5" stroke-linejoin="round"/>':'')+'</svg>';
}
function safeText(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]});
}
function renderLiveData(){
  var w=S.wx,b=S.bat,weatherKindName=w?weatherKind(Number(w.code)):"";
  $("cw").innerHTML=w?weatherSvg(w,16)+'<b>'+Number(w.temp)+'°</b>':"";
  $("cb").innerHTML=b?batterySvg(b,.95)+'<b>'+Math.round(b.level)+'%</b>':"";
  $("ew").innerHTML=w
    ?'<span class="di-metric-icon">'+weatherSvg(w,29)+'</span><span class="di-metric-text"><b class="di-metric-value">'+Number(w.temp)+'°</b><small class="di-metric-label">'+WEATHER_NAMES[weatherKindName]+(w.city?' · '+safeText(w.city):'')+'</small></span>'
    :'<span class="di-metric-icon">'+weatherSvg({code:3,day:true},29)+'</span><span class="di-metric-text"><b class="di-metric-value">--°</b><small class="di-metric-label">Weather unavailable</small></span>';
  $("eb").innerHTML=b
    ?'<span class="di-metric-icon">'+batterySvg(b,1.45)+'</span><span class="di-metric-text"><b class="di-metric-value">'+Math.round(b.level)+'%</b><small class="di-metric-label">'+(b.charging?'Charging':'On battery')+'</small></span>'
    :'<span class="di-metric-icon">'+batterySvg({level:0,charging:false},1.45)+'</span><span class="di-metric-text"><b class="di-metric-value">--</b><small class="di-metric-label">Battery status unavailable</small></span>';
  fitIsland();
}

function showAutomaticStatus(){
  var slot=Math.floor(Date.now()/(10*60*1000));
  if(slot===lastAutoSlot)return;
  lastAutoSlot=slot;
  if(pinned||hover)return;
  autoOpenUntil=Date.now()+5700;
  setOpen(true);
  window.clearTimeout(autoCloseTimer);
  autoCloseTimer=window.setTimeout(function(){
    if(!pinned&&!hover&&Date.now()>=autoOpenUntil)setOpen(false);
  },5900);
}
function tickIsland(){
  updateSchoolStatus();
  showAutomaticStatus();
}
I.addEventListener("pointerenter",function(){
  hover=true;
  setOpen(true);
});
I.addEventListener("pointerleave",function(){
  hover=false;
  if(!pinned&&Date.now()>=autoOpenUntil)setOpen(false);
});
I.addEventListener("click",function(){
  pinned=!pinned;
  if(pinned){
    window.clearTimeout(autoCloseTimer);
    autoOpenUntil=0;
  }
  setOpen(pinned||hover);
});
I.addEventListener("keydown",function(event){
  if(event.key==="Enter"||event.key===" "){
    event.preventDefault();
    pinned=!pinned;
    if(pinned){window.clearTimeout(autoCloseTimer);autoOpenUntil=0;}
    setOpen(pinned||hover);
  }else if(event.key==="Escape"){
    pinned=false;autoOpenUntil=0;setOpen(false);
  }
});
window.addEventListener("resize",fitIsland,{passive:true});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitIsland);
tickIsland();
window.setInterval(updateSchoolStatus,1000);
window.setInterval(showAutomaticStatus,1000);
window.setTimeout(function(){
  if(!pinned&&!hover)showAutomaticStatus();
},900);

/* state from the shell: theme and bookmarks */
addEventListener("message",function(e){var d=e.data;if(!d)return;
if(d.type==="mw-state"){
  if(d.vars){for(var k in d.vars)document.documentElement.style.setProperty(k,d.vars[k]);rgb=hex(d.vars["--mw-accent"])}
  S.bat=d.bat||null;S.wx=d.wx||null;chips(d.bm);renderGrid(performance.now());renderLiveData();
}});
send({type:"mw-ready"});
})();
</script>
