<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Minason Web v1</title>

		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>

		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5/index.css" />
		<style>
			:root {
				--mw-accent: #8f7cff;
				--mw-bg: #0a0a12;
				--mw-g1: #8f7cff;
				--mw-g2: #4f46e5;
				--mw-fg: #ececf6;
				--mw-mut: #9a9ab4;
				--mw-line: rgba(255, 255, 255, 0.09);
				--mw-panel: rgba(22, 22, 36, 0.72);
				--mw-font: "Manrope Variable", Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
			}

			html,
			body {
				background-color: var(--mw-bg) !important;
				background-image:
					radial-gradient(60vmax 42vmax at 6% -12%, color-mix(in srgb, var(--mw-g1) 34%, transparent), transparent),
					radial-gradient(55vmax 42vmax at 104% 112%, color-mix(in srgb, var(--mw-g2) 30%, transparent), transparent) !important;
				background-attachment: fixed !important;
				color: var(--mw-fg);
				font-family: var(--mw-font) !important;
			}

			body > div {
				background: transparent !important;
				font-family: var(--mw-font) !important;
			}

			button,
			input,
			select,
			textarea {
				font-family: inherit !important;
			}

			::selection {
				background: color-mix(in srgb, var(--mw-accent) 40%, transparent);
			}

			:focus-visible {
				outline: 2px solid var(--mw-accent);
				outline-offset: 2px;
			}

			/* top bar: frosted glass */
			.top-bar {
				background: var(--mw-panel) !important;
				backdrop-filter: blur(20px) saturate(140%);
				-webkit-backdrop-filter: blur(20px) saturate(140%);
				border: 1px solid var(--mw-line) !important;
				border-radius: 14px 14px 0 0;
				margin: 8px 8px 0;
				padding: 4px 6px;
				gap: 4px !important;
			}

			.tab-bar {
				gap: 4px !important;
				align-items: center !important;
			}

			.tab-bar::before {
				content: "minason web";
				align-self: center;
				padding: 0 12px 0 10px;
				font-weight: 300;
				font-size: 1.05em;
				letter-spacing: -0.03em;
				white-space: nowrap;
				background: linear-gradient(115deg, var(--mw-fg) 35%, var(--mw-accent));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}

			/* pill tabs */
			.tab-button {
				color: var(--mw-mut) !important;
				border: 1px solid transparent !important;
				border-radius: 999px !important;
				padding: 0.3em 1em !important;
				min-height: 30px !important;
				margin: 0 !important;
				transition: background 0.22s, color 0.22s, transform 0.22s;
			}

			.tab-button:hover {
				background: var(--mw-line) !important;
				color: var(--mw-fg) !important;
			}

			.tab-button.active {
				color: var(--mw-fg) !important;
				background: linear-gradient(
					180deg,
					color-mix(in srgb, var(--mw-accent) 24%, var(--mw-panel)),
					var(--mw-panel)
				) !important;
				border-color: var(--mw-line) !important;
				margin-bottom: 0 !important;
			}

			/* address bar + inputs: pill with glow on focus */
			.top-bar input,
			.tab-bar input {
				background: color-mix(in srgb, var(--mw-fg) 7%, transparent) !important;
				color: var(--mw-fg) !important;
				border: 1px solid var(--mw-line) !important;
				border-radius: 999px !important;
				padding: 0 14px !important;
				outline: none !important;
				transition: box-shadow 0.22s, border-color 0.22s;
			}

			.top-bar input:focus,
			.tab-bar input:focus {
				border-color: var(--mw-accent) !important;
				box-shadow: 0 0 0 3px color-mix(in srgb, var(--mw-accent) 35%, transparent);
			}

			/* buttons inside the app */
			.tab-panel button:not(.tab-button) {
				border-radius: 10px;
				transition: filter 0.22s, transform 0.22s;
			}

			.tab-panel button:not(.tab-button):active {
				transform: scale(0.97);
			}

			/* content area */
			.tab-panel {
				background: var(--mw-panel);
				backdrop-filter: blur(18px);
				-webkit-backdrop-filter: blur(18px);
				border: 1px solid var(--mw-line);
				border-top: 0;
				margin: 0 8px 8px;
				border-radius: 0 0 14px 14px;
				overflow: hidden;
			}

			::-webkit-scrollbar {
				width: 10px;
				height: 10px;
			}

			::-webkit-scrollbar-thumb {
				background: var(--mw-line);
				border-radius: 8px;
				border: 2px solid transparent;
				background-clip: padding-box;
			}

			::-webkit-scrollbar-track {
				background: transparent;
			}
		</style>
	</head>

	<body class="light-mode">
		<div id="app"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
